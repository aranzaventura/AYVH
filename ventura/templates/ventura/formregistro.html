{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLOCAR TITULO</title>

    <link rel="stylesheet" href="{% static 'ventura/estilos.css' %}">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>Registra tus datos</h1>

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#">uno</a></li>
                <li><a href="#">dos</a></li>
                <li><a href="#">tres</a></li>
            </ul>
        </nav>
    </header>
<form method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombre" placeholder="escribe tu nombre" required>
        <label>Apellido Paterno</label>
        <input type="text" name="apellidop" placeholder="escribe tu apellido paterno">
        <label>Apellido Materno:</label>
        <input type="text" name="apellidom" placeholder="Escribe tu apellido materno">
        <label>Edad:</label>
        <input type="number" name="edad" min="14" max="25" placeholder="Escribe tu edad">
        <label>Genero</label>
        <input type="radio" name="genero" value="Femenino">
        <input type="radio" name="genero" value="Masculino">

        <button type="submit">Guardar</button>
    </form>



    <!-- PIE DE PÁGINA -->
    <footer>
        <p>AGREGA TU PIE DE PAGINA</p>
    </footer>

</body>
</html>
